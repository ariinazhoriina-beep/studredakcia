<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Студредакция «МГИМО для иностранцев»</title>
<meta property="og:title" content="Студредакция «МГИМО для иностранцев»">
<meta property="og:description" content="Рабочие страницы студенческой редакции канала «МГИМО для иностранцев».">
<link rel="icon" href="favicon.svg">
<meta property="og:image" content="https://ariinazhoriina-beep.github.io/studredakcia/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=Unbounded:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#192F9A;--ink:#FFFFFF;--muted:#C5CDF6}
@media (prefers-color-scheme: dark){:root{--bg:#111A56;--ink:#F1F3FF;--muted:#A2AEEA}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Unbounded","Golos Text",sans-serif;font-weight:600;font-size:clamp(26px,6vw,38px);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0;font-size:17px;line-height:1.55;color:var(--muted)}
</style>
</head>
<body>
<main>
  <span class="eyebrow">МГИМО для иностранцев</span>
  <h1>Студредакция</h1>
  <p>Здесь живут рабочие страницы студенческой редакции. Ссылку на нужную страницу присылает Ари в чате редакции.</p>
</main>
</body>
</html>
